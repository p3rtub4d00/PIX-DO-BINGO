<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorteio ao Vivo | Pix do Bingo</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#061626">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="jogo.css?v=flyer20261019">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="game-body premium-game">

<header class="game-header premium-game-header">
  <a class="game-brand" href="/">
    <span class="game-brand-mark"><i></i><i></i><i></i><i></i></span>
    <span><b>PIX <em>DO</em></b><strong>BINGO</strong></span>
  </a>
  <div class="game-header-right">
    <div id="sorteio-id-display" class="round-id">#---</div>
    <button id="btn-toggle-som" class="sound-button" type="button" aria-label="Ativar ou desativar som"><i class="fa-solid fa-volume-high"></i></button>
    <div class="live-badge"><i></i> AO VIVO</div>
  </div>
</header>

<main class="game-shell">
  <section class="game-live-card">
    <div class="game-live-copy">
      <span class="game-kicker">SORTEIO EM ANDAMENTO</span>
      <h1>Último número sorteado</h1>
      <p>Acompanhe a rodada e veja sua cartela ser marcada automaticamente.</p>
    </div>
    <div class="current-ball-wrap">
      <div id="ultimo-numero-sorteado" class="bola-gigante premium-ball">--</div>
    </div>
  </section>

  <section class="draw-history-card">
    <div class="section-head-game">
      <div><span class="game-kicker">HISTÓRICO</span><h2>Números sorteados</h2></div>
      <span class="auto-mark"><i class="fa-solid fa-wand-magic-sparkles"></i> marcação automática</span>
    </div>
    <div id="globo-numeros"></div>
  </section>

  <section class="cartelas-wrapper premium-cards-wrap">
    <div class="section-head-game">
      <div><span class="game-kicker">MINHAS CARTELAS</span><h2>Jogue acompanhando ao vivo</h2></div>
      <span class="card-status"><i class="fa-solid fa-circle"></i> Em jogo</span>
    </div>

    <div class="cartela-controls">
      <button id="btn-cartela-anterior" class="btn-nav" type="button"><i class="fa-solid fa-chevron-left"></i></button>
      <span id="cartela-titulo-atual" class="paginacao-txt">Carregando...</span>
      <button id="btn-cartela-proxima" class="btn-nav" type="button"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div id="cartelas-container"></div>
    <div id="cartela-id-display" class="cartela-hash"></div>
  </section>

  <button id="btn-bingo" style="display:none;">BINGO</button>
</main>

<div id="modal-resultado" class="modal-overlay-game">
  <div class="modal-content-game">
    <div class="trofeu-icon"><i class="fa-solid fa-trophy"></i></div>
    <h1 id="resultado-titulo">VENCEDOR!</h1>
    <p id="resultado-mensagem" class="msg-win"></p>

    <div id="resultado-prova-cartela" style="display:none;">
      <div id="area-comprovante" class="comprovante-box">
        <h3>Comprovante de Vitória</h3>
        <p id="comprovante-sorteio-id"></p>
        <p id="comprovante-cartela-id"></p>
        <p id="comprovante-nome" class="destaque-txt"></p>
        <p id="comprovante-premio" class="premio-txt"></p>
        <p id="comprovante-data"></p>
        <div id="cartela-vencedora-display"></div>
      </div>
    </div>

    <button id="btn-baixar-comprovante" class="btn-acao-secundaria" style="display:none;">Baixar comprovante (PDF)</button>
    <button id="btn-resultado-fechar" class="btn-acao-primaria">Continuar</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="jogo.js?v=cartelas-fix-20261019"></script>
</body>
</html>
