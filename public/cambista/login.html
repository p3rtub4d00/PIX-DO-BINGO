<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambista | Pix do Bingo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0%,rgba(37,215,127,.12),transparent 32%),#061626;font-family:Inter,sans-serif;color:#fff}
    .back{position:fixed;left:20px;top:20px;color:#8fa5b7;text-decoration:none;font-size:.75rem}.card{width:min(410px,100%);padding:30px;border:1px solid #18394f;border-radius:20px;background:#0a2033;box-shadow:0 25px 70px rgba(0,0,0,.3)}
    .brand{font-weight:900;font-size:1.05rem;margin-bottom:5px}.brand span{color:#25d77f}.sub{color:#8298aa;font-size:.76rem;margin-bottom:22px}.field{display:flex;align-items:center;gap:10px;background:#071927;border:1px solid #24455f;border-radius:10px;padding:0 12px;margin-bottom:10px}.field i{color:#25d77f}.field input{width:100%;height:46px;background:transparent;border:0;color:#fff;font:inherit}.field input:focus{outline:0}.submit{width:100%;height:46px;border:0;border-radius:10px;background:#25d77f;color:#062619;font-weight:900;cursor:pointer}.help{text-align:center;color:#70889b;font-size:.67rem;margin:15px 0 0}
  </style>
</head>
<body>
  <a href="/" class="back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
  <section class="card">
    <div class="brand">PIX <span>DO</span> BINGO</div>
    <div class="sub">Painel do cambista</div>
    <form id="form-login">
      <label class="field"><i class="fa-solid fa-user"></i><input type="text" id="usuario" placeholder="Usuário" required></label>
      <label class="field"><i class="fa-solid fa-lock"></i><input type="password" id="senha" placeholder="Senha" required></label>
      <button type="submit" class="submit">Entrar no sistema</button>
    </form>
    <p class="help">Esqueceu a senha? Entre em contato com o administrador.</p>
  </section>
  <script src="login.js"></script>
</body>
</html>
