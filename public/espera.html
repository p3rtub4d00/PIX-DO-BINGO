<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aguardando Sorteio | Pix do Bingo</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#061626">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="jogo.css?v=flyer20261019">
  <link rel="stylesheet" href="espera.css">
</head>
<body class="espera-body premium-wait">
  <main class="wait-shell">
    <section class="wait-head">
      <a class="game-brand" href="/">
        <span class="game-brand-mark"><i></i><i></i><i></i><i></i></span>
        <span><b>PIX <em>DO</em></b><strong>BINGO</strong></span>
      </a>
      <a href="/" class="wait-back"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </section>

    <section class="wait-card">
      <div class="wait-status"><i></i> PRÓXIMO SORTEIO</div>
      <div id="sorteio-id-display" class="badge-id">#CARREGANDO</div>
      <h1>Suas cartelas já estão garantidas.</h1>
      <p>Fique nesta tela. Assim que a rodada começar, você acompanha tudo em tempo real.</p>
      <div class="wait-timer-label">O sorteio começa em</div>
      <div id="cronometro" class="wait-timer">--:--</div>

      <div class="wait-divider"></div>

      <div class="cartela-controls" id="cartela-switcher">
        <button id="btn-cartela-anterior" class="btn-nav"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="cartela-titulo-atual" class="paginacao-txt">Carregando...</span>
        <button id="btn-cartela-proxima" class="btn-nav"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div id="cartelas-container"></div>
      <div id="cartela-id-display" class="cartela-hash"></div>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="espera.js"></script>
</body>
</html>
