<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Pix do Bingo</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
  <div class="login-container card">
    <div class="pix-admin-logo" style="justify-content:center;margin-bottom:20px!important;">
      <span class="pix-admin-mark"><i></i><i></i><i></i><i></i></span>
      <span><b>PIX <em>DO</em></b><strong>BINGO</strong><small>ADMINISTRATIVO</small></span>
    </div>
    <h1 style="font-size:1.35rem;margin-bottom:5px;">Acesso administrativo</h1>
    <p>Entre com suas credenciais para gerenciar a operação.</p>
    <form id="login-form">
      <div class="form-grupo"><label for="usuario">Usuário</label><input type="text" id="usuario" name="usuario" required></div>
      <div class="form-grupo"><label for="senha">Senha</label><input type="password" id="senha" name="senha" required></div>
      <button type="submit" class="btn-comprar btn-destaque">Entrar no painel</button>
    </form>
    <p id="login-error" class="error-message" style="display:none;">Usuário ou senha inválidos.</p>
  </div>
  <script src="login.js"></script>
</body>
</html>
